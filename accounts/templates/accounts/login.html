<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 实验室设备预约</title>
</head>
<body>
    <main>
        <h1>登录实验室设备预约系统</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button type="submit">登录</button>
        </form>
    </main>
</body>
</html>
