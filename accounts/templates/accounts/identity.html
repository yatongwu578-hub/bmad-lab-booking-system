<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的身份 · 实验室设备预约</title>
</head>
<body>
    <main>
        <h1>我的身份</h1>
        <dl>
            <dt>账号</dt>
            <dd>{{ account.username }}</dd>
            <dt>业务角色</dt>
            <dd>{{ account.get_role_display }}</dd>
        </dl>
        <p><a href="{% url 'equipment-catalog' %}">查看设备目录</a></p>
        {% if can_reserve %}<p><a href="{% url 'reservation-list' %}">我的预约</a></p>{% endif %}
        {% if is_business_admin %}<p><a href="{% url 'admin-reservation-list' %}">预约管理</a></p>{% endif %}
        {% include "equipment/_create_link.html" %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">退出登录</button>
        </form>
    </main>
</body>
</html>
