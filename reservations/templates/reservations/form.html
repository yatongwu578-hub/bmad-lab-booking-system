<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>申请预约 · 实验室设备预约</title></head>
<body><main>
    <h1>申请预约</h1>
    <p>设备：{{ equipment.number }} · {{ equipment.name }}</p>
    <p id="time-rules">请填写北京时间同一天的整点时段。开始时间须在未来，至少预约一小时，最晚 23:00 结束。</p>
    {% if message %}<p role="alert">{{ message }}</p>{% endif %}
    <form method="post" aria-describedby="time-rules">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">提交预约申请</button>
    </form>
</main></body>
</html>
